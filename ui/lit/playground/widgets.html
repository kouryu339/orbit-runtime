<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>View 控件预览</title><style>*{box-sizing:border-box}body{margin:0;background:#101a22;color:#e0e9ed;font:14px/1.6 system-ui}main{max-width:1100px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:18px}h1{font-size:22px;margin:0}p{color:#aabac4;margin:4px 0 14px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:24px}agent-runtime-conversation{height:78vh;min-height:540px}aside{display:grid;gap:12px;align-content:start}button,select{font:inherit;padding:10px;border:1px solid #405463;border-radius:8px;color:inherit;background:#1a2b37;cursor:pointer}label{display:grid;gap:6px}button:focus-visible,select:focus-visible{outline:2px solid #73cfc1;outline-offset:3px}pre{white-space:pre-wrap;overflow-wrap:anywhere;color:#c6d9df;border-top:1px solid #405463;padding-top:14px;font:13px/1.7 system-ui}.narrow{max-width:620px}.narrow .layout{grid-template-columns:1fr}@media(max-width:720px){main{padding:14px}.layout{grid-template-columns:1fr}agent-runtime-conversation{height:70vh}header{flex-wrap:wrap}}</style></head><body><main><header><div><h1>View 控件预览</h1><p>真实 Lit 组件 · 本地模拟数据</p></div><button id="reset">重置示例</button></header><div class="layout"><agent-runtime-conversation id="chat" theme="midnight" color-scheme="dark" locale="zh-CN"></agent-runtime-conversation><aside><label>场景<select id="scene"><option value="single">单选 + 其他</option><option value="multi">多选 + 其他</option><option value="path">文件路径</option><option value="text">文本输入</option><option value="confirm">确认 / 取消</option><option value="all">完整表单</option></select></label><label>主题<select id="scheme"><option value="dark">深色</option><option value="light">浅色</option></select></label><button id="width">切换窄屏布局</button><p>浏览按钮模拟选择文件，不读取本地文件。提交后可在下方查看实际回传文字。</p><pre id="result" aria-live="polite">尚未提交</pre></aside></div></main><script type="module" src="/widgets.ts"></script></body></html>
