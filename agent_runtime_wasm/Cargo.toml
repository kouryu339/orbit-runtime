[package]
name = "orbit-runtime-wasm"
version = "0.5.3"
edition = "2021"
license = "Apache-2.0"
description = "Browser Worker entry point for the shared Orbit Runtime"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
corework = { path = "../corework", default-features = false, features = ["memory-event-bus", "type_structure"] }
ai-assistant = { path = "../ai-assistant" }
llm-gateway = { path = "../ai-gateway" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["sync", "macros"] }
async-trait = { workspace = true }
uuid = { version = "1", features = ["v4", "serde", "js"] }
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "=0.4.78"
js-sys = "=0.3.105"
sha2 = "0.10"
